[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nexus-node-fl-engine"
version = "0.1.0"
description = "Federated Learning orchestration service for Nexus Node"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.0",
    "alembic>=1.13.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.1.0",
    "python-multipart>=0.0.7",
    "boto3>=1.34.0",
    "httpx>=0.27.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "structlog>=24.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.3.0",
]
client = [
    "httpx>=0.27.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "pyyaml>=6.0",
    "psutil>=5.9.0",
    "structlog>=24.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["nexus"]
